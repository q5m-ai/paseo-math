name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run sdk
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm audit --omit=dev --audit-level=moderate
